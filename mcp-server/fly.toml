# fly.toml — Instrata Project Tools MCP server (read tools + scoped cutsheet
# submittal writes, behind its own OAuth 2.1 authorization server).
# Deploy from this directory:  fly deploy   (or: fly deploy -c mcp-server/fly.toml)
# CI also deploys on pushes to main touching mcp-server/** (.github/workflows/deploy-mcp.yml),
# so set secrets BEFORE merging auth changes.
# Secrets (runtime env, NOT build args):
#   fly secrets set SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_JWT_SECRET=... \
#                   PUBLIC_BASE_URL=https://instrata-project-tools-mcp.fly.dev \
#                   OAUTH_ADMIN_CLIENT_ID=... OAUTH_ADMIN_CLIENT_SECRET=...   # optional pair
# No redirects anywhere: force_https only 301s plain-http requests, which no
# OAuth/MCP client sends. Do not add trailing-slash or www rewrites.
app = "instrata-project-tools-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: MCP clients (mcp-remote) have a ~10s connect
  # timeout, and a cold start from a fully-stopped machine can exceed that,
  # causing tool calls to fail. Running one small machine 24/7 is cheap and
  # makes interactive use snappy.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

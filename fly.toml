# fly.toml — Instrata Project Tools
app = "instrata-project-tools"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_SUPABASE_URL = ""
  VITE_SUPABASE_ANON_KEY = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

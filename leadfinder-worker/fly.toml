# fly.toml — Lead Finder worker (instrata-leadfinder). INTERIM deploy.
#
# Exactly ONE always-on machine: it runs the job queue the Project Tools Lead Finder
# tab feeds (lf_job), the daily scheduled run, and the BuildingConnected OAuth round
# trip, whose sign-in state lives in memory (a second machine breaks Connect).
# Fly starts two machines on a first deploy; keep it at one with
#   fly scale count 1 --app instrata-leadfinder --yes
#
# Leads only: no volume, so bid documents (SAM attachment downloads, uploads,
# downloads) and triage are switched off (DOCUMENTS_ENABLED=false). They come back
# on a host with persistent disk (the planned company Docker host): mount a volume
# at LEADFINDER_DATA_DIR, set DOCUMENTS_ENABLED=true, add ANTHROPIC_API_KEY, and
# load the old documents with `leadfinder docs import` (see README).
#
# Secrets (leadfinder-worker/scripts/set-fly-secrets.ps1 stages them):
#   DATABASE_URL                Supabase Postgres (session pooler URL, port 5432)
#   SUPABASE_URL                https://<ref>.supabase.co
#   SUPABASE_ANON_KEY           checking the signed-in admin's token (/bc/authorize)
#   SAM_API_KEY                 SAM.gov public API key (expires every 90 days)
#   HTTP_USER_AGENT_CONTACT     contact email in the User-Agent sent to SAM.gov / Census
#   APS_CLIENT_ID / APS_CLIENT_SECRET   Autodesk app for BuildingConnected
app = "instrata-leadfinder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DOCUMENTS_ENABLED = "false"
  LEADFINDER_DATA_DIR = "/app/data"
  APP_URL = "https://instrata-project-tools.fly.dev"
  PUBLIC_URL = "https://instrata-leadfinder.fly.dev"
  APS_CALLBACK_URL = "https://instrata-leadfinder.fly.dev/oauth/callback"
  SCHEDULE_HOUR_ET = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Same size as the sync engine. Raise to 512mb if runs are killed for memory.
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadfinder"
version = "0.1.0"
description = "AV Lead Finder worker for Instrata Project Tools: fetch, score and triage bids near Instrata offices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "anthropic>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[project.scripts]
leadfinder = "leadfinder.cli:app"

[tool.setuptools.packages.find]
include = ["leadfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network endpoints (deselected by default)"]
addopts = "-m 'not live'"
